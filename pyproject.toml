[project]
name = "lingxi"
version = "2.0.0"
description = "灵犀企业问数：StarRocks + PostgreSQL + 企业授权异步查询"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "灵犀项目组" }]
keywords = ["text-to-sql", "starrocks", "llm", "bi", "fastapi"]
dependencies = [
    "fastapi==0.143.2", "uvicorn==0.54.0", "pydantic==2.14.1", "httpx==0.28.1",
    "psycopg2-binary==2.9.13", "PyMySQL==1.2.3", "sqlglot==30.23.0",
]

[project.optional-dependencies]
legacy = ["duckdb>=1.0.0", "pandas>=2", "filelock>=3.15,<4", "python-dotenv>=1", "requests>=2.31", "PyJWT[crypto]>=2.8"]
embedding = ["sentence-transformers>=3,<6", "transformers>=4.44,<5", "sentencepiece>=0.2,<1"]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.28,<1",
    "ruff>=0.6.0",
]

# ---------------------------------------------------------------------------
# 说明：本文件与 requirements.txt 并存。
#   - requirements.txt：老式 pip install -r requirements.txt 安装（保留，供习惯用）
#   - pyproject.toml：现代打包元数据 + 依赖声明（pip install -e . 或 pip install .）
#   两者依赖清单保持一致；以 pyproject.toml 为唯一真源，requirements.txt 同步维护。
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["enterprise_tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
# 默认启用 E/F/W 规则集（错误、Pyflakes、警告）
lint.select = ["E", "F", "W", "I"]
# 忽略规则（说明）：
#   E501 行过长 —— line-length=100 已足够，SQL/prompt 长字符串难免超长，
#         强行拆分会破坏可读性，故全局忽略。
lint.ignore = ["E501"]
# 排除目录：第三方/生成物不入库检查
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint.per-file-ignores]
# 脚本入口：允许顶层 sys.path 操作与 try/except 兜底（为脚本式运行服务）
"scripts/*.py" = ["E402"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
