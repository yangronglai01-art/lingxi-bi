# Render image digest, namespace and Secret through the enterprise GitOps pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lingxi-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: lingxi-api}
  template:
    metadata:
      labels: {app: lingxi-api}
    spec:
      terminationGracePeriodSeconds: 90
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
      - name: api
        image: REPLACE_WITH_REGISTRY_IMAGE_DIGEST
        envFrom: [{secretRef: {name: lingxi-runtime}}]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: "500m", memory: "512Mi"}
          limits: {cpu: "2", memory: "2Gi"}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: tmp, mountPath: /tmp}, {name: certs, mountPath: /run/certs, readOnly: true}]
        livenessProbe: {httpGet: {path: /health/live, port: 8080}, initialDelaySeconds: 10}
        readinessProbe: {httpGet: {path: /health/ready, port: 8080}, initialDelaySeconds: 5}
      volumes:
      - {name: tmp, emptyDir: {}}
      - {name: certs, secret: {secretName: lingxi-ca}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lingxi-worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: lingxi-worker}}
  template:
    metadata: {labels: {app: lingxi-worker}}
    spec:
      terminationGracePeriodSeconds: 90
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
      - name: worker
        image: REPLACE_WITH_REGISTRY_IMAGE_DIGEST
        command: ["python", "-m", "src.enterprise.worker"]
        envFrom: [{secretRef: {name: lingxi-runtime}}]
        resources: {requests: {cpu: "1", memory: "1Gi"}, limits: {cpu: "2", memory: "4Gi"}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: tmp, mountPath: /tmp}, {name: certs, mountPath: /run/certs, readOnly: true}]
      volumes:
      - {name: tmp, emptyDir: {}}
      - {name: certs, secret: {secretName: lingxi-ca}}
---
apiVersion: v1
kind: Service
metadata: {name: lingxi-api}
spec:
  selector: {app: lingxi-api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: lingxi-api}
spec: {minAvailable: 1, selector: {matchLabels: {app: lingxi-api}}}
