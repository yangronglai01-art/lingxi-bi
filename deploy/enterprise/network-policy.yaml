# Platform must confirm private endpoints/DNS and ingress labels before rollout.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lingxi-private-egress}
spec:
  podSelector:
    matchExpressions:
    - {key: app, operator: In, values: [lingxi-api, lingxi-worker]}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:
    - ipBlock: {cidr: 10.0.0.0/8}
    - ipBlock: {cidr: 172.16.0.0/12}
    - ipBlock: {cidr: 192.168.0.0/16}
    ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 5432}, {protocol: TCP, port: 9030}]
