# StarRocks FE 缩配（开发单节点）：默认 -Xmx8192m 在 7.6GB Docker VM 内无法启动
# 依据任务书「开发可缩为单 FE/BE」，显式降堆，保留其余默认值
LOG_DIR = ${STARROCKS_HOME}/log

DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx2048m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time -XX:ErrorFile=${LOG_DIR}/hs_err_pid%p.log -Djava.security.policy=${STARROCKS_HOME}/conf/udf_security.policy"

sys_log_level = INFO
# meta_dir = ${STARROCKS_HOME}/meta

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
mysql_service_nio_enabled = true

priority_networks = 127.0.0.1/32

async_load_task_pool_size=20
catalog_trash_expire_second=3600
default_bucket_num=48
enable_udf = true
default_replication_num = 1
enable_load_volume_from_conf = true
priority_networks = 127.0.0.1/32
priority_networks = 127.0.0.1/32
priority_networks = 127.0.0.1/32
priority_networks = 127.0.0.1/32
priority_networks = 127.0.0.1/32
